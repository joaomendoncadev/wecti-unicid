# Reverse proxy para a API Spring Boot (container "wecti-api" na porta 8080).
# Instalar em /etc/nginx/sites-available/api.wecti.com.br e linkar em sites-enabled.
# Rodar certbot --nginx -d api.wecti.com.br depois do DNS propagar.
#
# server.forward-headers-strategy=framework (application.yml do backend) exige
# X-Forwarded-Proto/Host/For corretos - sem isso o rate-limit de login vê
# sempre o IP do Nginx, e URLs geradas pela API saem como http:// mesmo
# atras de HTTPS.

server {
    server_name api.wecti.com.br;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.wecti.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.wecti.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.wecti.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.wecti.com.br;
    return 404; # managed by Certbot


}