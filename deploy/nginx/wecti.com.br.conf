# Frontend estatico (landing + SPA React) - equivalente ao .htaccess do projeto.
# Instalar em /etc/nginx/sites-available/wecti.com.br e linkar em sites-enabled.
# Rodar certbot --nginx -d wecti.com.br -d www.wecti.com.br depois do DNS propagar
# (ele reescreve este arquivo para adicionar o bloco 443/ssl automaticamente).

server {
    server_name wecti.com.br www.wecti.com.br;

    root /var/www/wecti;
    index home.html index.html;

    # Raiz do dominio cai na landing publica, nao no sistema React.
    location = / {
        try_files /home.html =404;
    }

    # Fotos e assets com hash no nome: cache longo.
    location ~* \.(?:jpg|jpeg|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Paginas de palestrante (arquivo real) e demais arquivos estaticos.
    # Qualquer caminho que nao seja arquivo real cai no index.html - sao as
    # rotas do React Router (/eventos, /validar/..., /checkin/confirmar/...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wecti.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wecti.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.wecti.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = wecti.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wecti.com.br www.wecti.com.br;
    return 404; # managed by Certbot




}