# Frontend estatico (landing + SPA React) - equivalente ao .htaccess do projeto.
# Instalar em /etc/nginx/sites-available/wecti.com.br e linkar em sites-enabled.
# Rodar certbot --nginx -d wecti.com.br -d www.wecti.com.br depois do DNS propagar
# (ele reescreve este arquivo para adicionar o bloco 443/ssl automaticamente).

server {
    server_name wecti.com.br www.wecti.com.br;

    root /var/www/wecti;
    index home.html index.html;

    # ── Cache ────────────────────────────────────────────────────────────
    # A regra que separa os dois grupos abaixo e simples: o nome do arquivo
    # muda quando o conteudo muda?
    #
    #   /assets/index-BUF9LA12.js  -> sim, o Vite poe um hash. Pode ficar um
    #                                 ano no navegador; um deploy gera outro
    #                                 nome e ninguem serve conteudo velho.
    #   /style.css, /*.html        -> NAO. Sao sempre o mesmo endereco, com
    #                                 conteudo novo a cada deploy.
    #
    # Sem Cache-Control explicito o navegador aplica cache heuristico e
    # decide sozinho por quanto tempo guardar - foi o que aconteceu em
    # 07/09/2026: o style.css e compartilhado entre a landing e a pagina de
    # inscricoes, entao quem tinha visitado a home antes do deploy abriu a
    # pagina nova com o CSS antigo, sem as regras dela, e viu o conteudo
    # sem estilo nenhum.
    #
    # "no-cache" nao proibe guardar - obriga a perguntar antes de reusar. Com
    # o ETag que o Nginx ja envia, a resposta e um 304 vazio quando nada
    # mudou, entao o custo e um round-trip, nao um download.

    # Raiz do dominio cai na landing publica, nao no sistema React.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /home.html =404;
    }

    # HTML: sempre revalida. Vale tambem para o /index.html que o fallback
    # de SPA entrega (try_files faz redirecionamento interno, e o location
    # e reavaliado).
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # O CSS das paginas estaticas nao tem hash no nome - mesmo tratamento.
    location = /style.css {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fotos e fontes: conteudo estavel, cache longo.
    # So "add_header", sem "expires": os dois juntos emitiam DOIS
    # Cache-Control na mesma resposta.
    location ~* \.(?:jpg|jpeg|png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Assets do Vite: hash no nome, entao o cache pode ser imutavel de fato.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Paginas de palestrante (arquivo real) e demais arquivos estaticos.
    # Qualquer caminho que nao seja arquivo real cai no index.html - sao as
    # rotas do React Router (/eventos, /validar/..., /checkin/confirmar/...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wecti.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wecti.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.wecti.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = wecti.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wecti.com.br www.wecti.com.br;
    return 404; # managed by Certbot




}