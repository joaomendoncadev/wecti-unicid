name: CI

on:
  pull_request:
    branches: [main]
# Sem gatilho de push: neste repositorio, push na main dispara o deploy.yml,
# cujo primeiro job roda exatamente estes testes. Manter os dois gastaria
# minuto de Actions duas vezes pelo mesmo resultado - e um deploy so comeca
# depois de os testes passarem, entao nada deixa de ser coberto.

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wecti
          MYSQL_USER: wecti
          MYSQL_PASSWORD: wecti
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u wecti -pwecti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        working-directory: ./backend
        run: mvn -B -e verify
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: wecti
          DB_USER: wecti
          DB_PASSWORD: wecti
